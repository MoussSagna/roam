packages:
  - 'apps/*'
  - 'packages/*'

# Build scripts are opt-in with pnpm >= 10. unrs-resolver ships prebuilt binaries
# (used by eslint-import-resolver-typescript), so its install script is not needed.
# prisma / @prisma/engines (apps/api) download the schema engine used by migrations.
# @scarf/scarf is usage telemetry pulled in by swagger-ui-dist (@nestjs/swagger): not run.
allowBuilds:
  '@prisma/engines': true
  '@scarf/scarf': false
  prisma: true
  unrs-resolver: false

minimumReleaseAgeExclude:
  - '@expo/cli@57.0.27'
  - '@expo/router-server@57.0.11'
  - babel-preset-expo@57.0.13
  - expo-modules-core@57.0.19
  - expo-modules-jsi@57.1.1
  - expo@57.0.25
  - '@expo/ui@57.0.20'
  - expo-glass-effect@57.0.4
  - expo-linking@57.0.11
  - expo-router@57.0.23
